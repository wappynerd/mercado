name: Historia de opciones

# Baja las velas de 15 minutos de las opciones (CGR) y las acumula en data/opciones.json, para el costo
# histórico de las estrategias. Corre de lunes a viernes a media rueda y después del cierre (14:41 y 17:41 de
# Buenos Aires = 17:41 y 20:41 UTC), y también se puede lanzar a mano.
on:
  schedule:
    - cron: "41 17,20 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: opciones
  cancel-in-progress: false

jobs:
  opciones:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/opciones.py
        env:
          MDH_TOKEN: ${{ secrets.MDH_TOKEN }}
      - name: Guardar si cambió
        run: |
          git add data/opciones.json
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Opciones al $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
